<!DOCTYPE html>
<!--
  packages/web/demo/crowd_dance.html  —  a crowd of generated humans dancing to real mocap.

  Serve from the REPO ROOT (same as the other demos):
    python3 -m http.server 8000
  then open http://localhost:8000/packages/web/demo/crowd_dance.html

  WHAT WAS WRONG WITH THE PREVIOUS VERSION (and what this one does instead)
  --------------------------------------------------------------------------
  1. The mocap was reduced to ~10 scalar angles per frame (from joint POSITIONS)
     and replayed as hinge rotations in bind space. That throws away most of the
     pose (pelvis orientation, spine/neck/hand/foot rotation, limb twist), and it
     ignored the parent's CURRENT rotation, so angles compounded down the body:
     torso lean + arm swing + ... => dancers folded flat and floated in the air.
     NOW: clips are retargeted as full 3D rotations (tools/bake_dance.mjs), one
     quaternion per driven joint (50 joints incl. fingers), and applied directly.
     Each engine bone is rotated so its DIRECTION follows the Mixamo bone, which
     absorbs the engine's A-pose vs Mixamo's T-pose. Root drift is removed so
     dancers stay on their spot, and at runtime each body's own lowest point in
     each clip is placed on the floor (pose.js groundShift).

  2. The engine exposes ONE global skeleton, but generate() reshapes the MESH
     (heightModifier scales it in Y, weightModifier in X, and every macrodetail
     morph changes proportions). So joints were nowhere near the limbs they
     were meant to rotate, and animation swung the mesh around wrong pivots.
     NOW: dance/skeleton_fit.js fits the skeleton to each body: every joint is
     moved by the same weighted blend of nearby-vertex displacements versus a
     reference body (max error ~1 % of height on a stretched body). The fitted
     skeleton is passed to toSkinnedMesh(), and the pelvis motion is pivoted
     around, and scaled to, each body's own pelvis (dance/pose.js).

  3. The random DNA stacked 3-6 macrodetail targets (baby + old + max-height ...)
     at random weights, giving anatomically impossible bodies. NOW each person
     is one adult ethnicity/gender target ("young", or occasionally "old") plus
     moderate height/weight modifiers.

  Files: dance/pose.js + dance/skeleton_fit.js (runtime), rust-core/dance_clips/
  dance_clips.{json,bin} (baked clips), tools/ (how they were baked).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AnthroForge — dance crowd demo</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #14151a; color: #e8e8ec; margin: 0; padding: 20px;
  }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: #9a9aa5; margin: 0 0 14px; font-size: 0.85rem; max-width: 780px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  label { font-size: 0.85rem; color: #c4c4cc; }
  input[type="number"] {
    width: 80px; padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3a45;
    background: #1c1d24; color: #e8e8ec; font-size: 0.9rem;
  }
  select {
    padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3a45;
    background: #1c1d24; color: #e8e8ec; font-size: 0.9rem; max-width: 220px;
  }
  button {
    background: #5b5bf0; color: white; border: none; padding: 9px 16px;
    border-radius: 6px; font-size: 0.9rem; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #4a4adf; }
  button:disabled { background: #3a3a45; cursor: not-allowed; }
  #status { font-size: 0.82rem; color: #c4c4cc; }
  .checkline { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #c4c4cc; }
  #canvas-wrap { width: 1100px; max-width: 100%; }
  canvas {
    display: block; width: 100%; aspect-ratio: 16 / 9;
    background: #1c1d24; border: 1px solid #2c2d36; border-radius: 8px;
  }
  .status-error {
    margin-top: 12px; padding: 10px 12px; border-radius: 6px;
    background: #3a1a1e; color: #ff8a8a; font-size: 0.82rem;
    display: none; white-space: pre-wrap; word-break: break-word; max-width: 1100px;
  }
  .status-error.visible { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js" } }
</script>
</head>

<body>

<h1>AnthroForge — dance crowd demo</h1>
<p class="sub">
  Generated humans dancing to real motion-capture clips. Each body gets its own
  fitted skeleton, so tall, short, wide and narrow dancers all move correctly.
</p>

<div class="toolbar">
  <label for="countInput">Number of humans</label>
  <input type="number" id="countInput" value="20" min="1" max="150" step="1" />
  <label for="danceSelect">Dance</label>
  <select id="danceSelect"><option>Loading…</option></select>
  <span class="checkline"><input type="checkbox" id="syncCheck" /> <label for="syncCheck">synchronized</label></span>
  <button id="generateBtn" disabled>Generate</button>
  <span id="status">Loading pack…</span>
</div>

<div id="canvas-wrap"><canvas id="canvas"></canvas></div>
<div class="status-error" id="statusError"></div>

<script type="module">
  const PART_PACK_URL = new URL("../../../rust-core/packs/essentials.afpp", import.meta.url).href;
  const MANIFEST_URL = new URL("../../../rust-core/packs/manifest.json", import.meta.url).href;
  const MORPH_ID_MAP_URL = new URL("../../../rust-core/packs/morph_id_map.json", import.meta.url).href;
  const DANCE_CLIPS_URL = new URL("../../../rust-core/dance_clips/", import.meta.url);

  const HEAD_ID = 4001, TORSO_ID = 4002, ARMS_ID = 4003, LEGS_ID = 4004;
  const HEIGHT_MIN = 0.87, HEIGHT_MAX = 1.13;        // heightModifier scales the mesh in Y
  const WEIGHT_MIN = 0.8, WEIGHT_MAX = 1.3;          // weightModifier scales the mesh in X
  const REF_HEIGHT = 16.66;                          // mesh height (engine units) of the default body
  const UNIT = 1.75 / REF_HEIGHT;                    // engine units -> metres (default body = 1.75 m)
  const SEAM = 0.3;                                  // seconds used to blend a clip's end back into its start
  const CROSSFADE = 0.45;                            // seconds when a character switches dance

  const statusEl = document.getElementById("status");
  const statusError = document.getElementById("statusError");
  const generateBtn = document.getElementById("generateBtn");
  const countInput = document.getElementById("countInput");
  const danceSelect = document.getElementById("danceSelect");
  const syncCheck = document.getElementById("syncCheck");
  const canvas = document.getElementById("canvas");

  function showError(msg) { statusError.textContent = msg; statusError.classList.add("visible"); }
  function clearError() { statusError.textContent = ""; statusError.classList.remove("visible"); }

  // Load the modules dynamically so a missing file produces a readable message
  // (a static import failure only shows up in the browser console).
  async function need(url) {
    try { return await import(url); }
    catch (e) {
      const msg = `Could not load ${url}.\n\n` +
        `This usually means the server is not running from the project's top-level folder (the one that contains\n` +
        `"packages", "rust-core" and start_demo.bat), or part of the project is missing.\n` +
        `Check that ${new URL(url, location.href).pathname} opens in your browser as JavaScript text, then hard-refresh (Ctrl+F5).`;
      showError(msg); statusEl.textContent = "Failed to load — see error below.";
      throw e;
    }
  }
  const { init, generate, getSkeleton, getLastError } = await need("../dist/index.js");
  const { toSkinnedMesh } = await need("../../web-three/dist/index.js");
  const THREE = await need("three");
  const { OrbitControls } = await need("./vendor/three/examples/jsm/controls/OrbitControls.js");
  const { buildFitter } = await need("./dance/skeleton_fit.js");
  const { loadDanceClips, Pose, samplePose, blendPose, applyPose, makeRootRig, buildSkinSamples, groundShift } = await need("./dance/pose.js");

  // ---------------------------------------------------------------------
  // DNA: one adult body type per person (ethnicity x gender x young/old)
  // ---------------------------------------------------------------------
  async function loadBodyMorphs() {
    const [mr, mm] = await Promise.all([fetch(MANIFEST_URL), fetch(MORPH_ID_MAP_URL)]);
    if (!mr.ok) throw new Error(`failed to fetch manifest.json: ${mr.status}`);
    if (!mm.ok) throw new Error(`failed to fetch morph_id_map.json: ${mm.status}`);
    const manifest = await mr.json(), map = await mm.json();
    const pack = manifest.packs.find((p) => p.id === "essentials");
    if (!pack) throw new Error('manifest.json has no "essentials" pack');
    const cats = new Set(pack.categories);
    const young = [], old = [];
    for (const [id, e] of Object.entries(map)) {
      if (!cats.has(e.category)) continue;
      const m = /^macrodetails\/[a-z]+-(?:male|female)-(young|old)\.target$/.exec(e.target ?? "");
      if (m) (m[1] === "young" ? young : old).push(Number(id));
    }
    if (!young.length) throw new Error("no adult macrodetail morphs found in the essentials pack");
    return { young, old };
  }
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  function randomDna(bodies) {
    const useOld = bodies.old.length && Math.random() < 0.2;
    const morph = useOld ? { id: pick(bodies.old), weight: rand(0.5, 1) } : { id: pick(bodies.young), weight: 1 };
    return {
      seed: BigInt(Math.floor(Math.random() * 1e12)),
      heightModifier: rand(HEIGHT_MIN, HEIGHT_MAX),
      weightModifier: rand(WEIGHT_MIN, WEIGHT_MAX),
      headId: HEAD_ID, torsoId: TORSO_ID, armsId: ARMS_ID, legsId: LEGS_ID,
      clothingIds: [],
      morphs: [morph],
    };
  }

  // ---------------------------------------------------------------------
  // Scene setup (same look as crowd.html)
  // ---------------------------------------------------------------------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1c1d24);
  scene.fog = new THREE.Fog(0x1c1d24, 25, 70);

  const camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  function resizeRenderer() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resizeRenderer);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(15, 25, 10);
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x7a86ff, 0.35);
  rim.position.set(-12, 10, -18);
  scene.add(rim);

  function makeGroundTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#22232b"; ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = "#33343e"; ctx.lineWidth = 2;
    for (let i = 0; i <= 256; i += 32) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  let groundSize = 40;
  const groundTex = makeGroundTexture();
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(groundSize, groundSize),
    new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95 }),
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // soft blob shadow under each dancer
  const shadowTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 2, 32, 32, 32);
    g.addColorStop(0, "rgba(0,0,0,0.55)"); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
  const shadowGeo = new THREE.PlaneGeometry(1.5, 1.5).rotateX(-Math.PI / 2);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.49;
  camera.position.set(0, 14, 22);
  controls.target.set(0, 1.2, 0);
  controls.update();

  const crowdGroup = new THREE.Group();
  scene.add(crowdGroup);

  const CHARACTER_COLORS = [0x8aa0ff, 0x7be08a, 0xff9a6b, 0xe0b85f, 0xd97ad9, 0x5fd0d0];

  // ---------------------------------------------------------------------
  // Crowd
  // ---------------------------------------------------------------------
  let characters = [];
  let skeleton = null, fitter = null, bodies = null, lib = null;
  let grooves = [];
  const poseA = new Pose(50), poseB = new Pose(50), poseC = new Pose(50), poseD = new Pose(50);

  function clearCrowd() {
    for (const ch of characters) {
      crowdGroup.remove(ch.group); scene.remove(ch.shadow);
      ch.mesh.geometry?.dispose?.();
      ch.mesh.material?.dispose?.();
    }
    characters = [];
  }

  function pickDance() {
    const sel = danceSelect.value;
    return sel === "__random__" ? pick(grooves) : sel;
  }

  function buildCharacter(dna, homeX, homeZ, facing, colorIdx) {
    const character = generate(dna);
    if (character === null) return { error: getLastError() ?? "generate() returned null" };
    const errAfter = getLastError();
    if (errAfter) return { error: `succeeded but getLastError() fired: ${errAfter}` };

    // fit the shared skeleton to THIS body, then bind the mesh to the fitted skeleton
    const fit = fitter.fit(character.positions);
    const material = new THREE.MeshStandardMaterial({ color: CHARACTER_COLORS[colorIdx % CHARACTER_COLORS.length], roughness: 0.6, metalness: 0.05 });
    // fit.joints already carries a per-character-fitted rest pose (skeleton_fit.js's
    // own correction for the same bind-pose/morph mismatch CC0-Phase 13 also fixes,
    // via a different, more general method). Applying character.restScale/restPivot
    // ON TOP of an already-fitted skeleton double-corrects and is measurably worse
    // (quantified: baby body, 60deg elbow bend, displacement as % of height:
    // fit alone 6.8%, fit+restScale stacked 28.6%) -- so force restScale/restPivot
    // to identity here and let the fitted skeleton be the only correction.
    const mesh = toSkinnedMesh({ ...character, restScale: [1, 1, 1], restPivot: [0, 0, 0] }, fit.joints, material);
    mesh.frustumCulled = false;                       // dancers leave their bind-pose bounds
    mesh.geometry.computeBoundingBox();
    const minY = mesh.geometry.boundingBox.min.y;

    const group = new THREE.Group();
    group.scale.setScalar(UNIT);
    group.position.set(homeX, -minY * UNIT, homeZ);
    group.rotation.y = facing;
    group.add(mesh);
    crowdGroup.add(group);

    const shadow = new THREE.Mesh(shadowGeo, shadowMat);
    shadow.position.set(homeX, 0.01, homeZ);
    shadow.scale.setScalar(1.0 + 0.5 * dna.weightModifier);
    scene.add(shadow);

    return {
      mesh, group, shadow, bones: mesh.skeleton.bones, rig: makeRootRig(fitter, fit.worldPos),
      fitJoints: fit.joints, skin: buildSkinSamples(character, fit.worldPos, fitter), shifts: new Map(),
      cur: null, prev: null, switchT: 0, phase: Math.random() * 120,
    };
  }

  // vertical correction so THIS body's lowest point in THIS clip meets the floor (computed once, cached)
  function shiftFor(ch, clip) {
    let v = ch.shifts.get(clip.name);
    if (v === undefined) { v = groundShift(lib, clip, ch.fitJoints, ch.rig, ch.skin, poseD); ch.shifts.set(clip.name, v); }
    return v;
  }
  function setDance(ch, name, T) {
    if (ch.cur && ch.cur.name === name) return;
    ch.prev = ch.cur; ch.cur = lib.byName[name]; ch.switchT = T;
    shiftFor(ch, ch.cur);
  }
  function assignDances() {
    const T = clock();
    for (const ch of characters) setDance(ch, pickDance(), T);
  }

  function generateCrowd(count) {
    clearCrowd();
    let generated = 0;
    const errors = [];

    const cols = Math.ceil(Math.sqrt(count));
    const rows = Math.ceil(count / cols);
    const spacing = 2.4;
    groundSize = Math.max(40, (Math.max(cols, rows) + 4) * spacing);
    ground.geometry.dispose();
    ground.geometry = new THREE.PlaneGeometry(groundSize, groundSize);
    groundTex.repeat.set(groundSize / 4, groundSize / 4);

    const T = clock();
    for (let i = 0; i < count; i++) {
      const dna = randomDna(bodies);
      const col = i % cols, row = Math.floor(i / cols);
      const homeX = (col - (cols - 1) / 2) * spacing;
      const homeZ = (row - (rows - 1) / 2) * spacing;
      const facing = rand(-0.3, 0.3);                 // roughly toward the camera

      const result = buildCharacter(dna, homeX, homeZ, facing, i);
      if (result.error) { errors.push(`character ${i}: ${result.error}`); continue; }
      setDance(result, pickDance(), T);
      characters.push(result);
      generated++;
    }

    const maxSpan = Math.max(cols, rows) * spacing;
    camera.position.set(0, Math.max(8, maxSpan * 0.5), Math.max(11, maxSpan * 0.68));
    controls.target.set(0, 1.2, 0);
    controls.update();
    return { generated, errors };
  }

  // ---------------------------------------------------------------------
  // Playback
  // ---------------------------------------------------------------------
  const smooth = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  const t0 = performance.now();
  const clock = () => (performance.now() - t0) / 1000;

  // grooves loop; moves/poses play once, hold, then repeat. Either way the seam is blended.
  function evalClip(ch, c, t, out) {
    if (c.kind === "groove") {
      const tt = t % c.duration;
      samplePose(lib, c, tt, out);
      const rem = c.duration - tt;
      if (rem < SEAM) { samplePose(lib, c, 0, poseC); blendPose(out, poseC, smooth(1 - rem / SEAM), out); }
    } else {
      const tt = t % (c.duration + c.hold);
      samplePose(lib, c, Math.min(tt, c.duration), out);
      if (tt < SEAM) { samplePose(lib, c, c.duration, poseC); blendPose(poseC, out, smooth(tt / SEAM), out); }
    }
    out.p[1] += shiftFor(ch, c) / ch.rig.s;
  }

  function animateCharacter(ch, T) {
    const t = syncCheck.checked ? T : T + ch.phase;
    evalClip(ch, ch.cur, t, poseA);
    if (ch.prev) {
      const w = (T - ch.switchT) / CROSSFADE;
      if (w < 1) { evalClip(ch, ch.prev, t, poseB); blendPose(poseB, poseA, smooth(w), poseA); }
      else ch.prev = null;
    }
    applyPose(lib, ch.bones, poseA, ch.rig);
  }

  function animate() {
    requestAnimationFrame(animate);
    const T = clock();
    for (const ch of characters) animateCharacter(ch, T);
    controls.update();
    renderer.render(scene, camera);
  }

  // ---------------------------------------------------------------------
  // Boot / UI wiring
  // ---------------------------------------------------------------------
  async function boot() {
    try {
      const [b, clips] = await Promise.all([
        loadBodyMorphs(),
        loadDanceClips(DANCE_CLIPS_URL),
        init({ partPackUrl: PART_PACK_URL, licenseKey: "" }),
      ]);
      bodies = b; lib = clips;
      if (lib.joints[0] !== 0 || lib.joints.length !== poseA.q.length / 4) throw new Error("dance_clips.json does not match this build");
      grooves = lib.clips.filter((c) => c.kind === "groove").map((c) => c.name);

      skeleton = getSkeleton();
      if (!skeleton) throw new Error(`getSkeleton() returned null: ${getLastError() ?? "(no message)"}`);

      // reference body (no morphs, height = weight = 1) that the skeleton was authored for
      const ref = generate({ seed: 1n, heightModifier: 1, weightModifier: 1, headId: HEAD_ID, torsoId: TORSO_ID, armsId: ARMS_ID, legsId: LEGS_ID, clothingIds: [], morphs: [] });
      if (ref === null) throw new Error(`reference generate() failed: ${getLastError() ?? "(no message)"}`);
      fitter = buildFitter(skeleton, ref.positions);

      danceSelect.innerHTML = "";
      const randomOpt = document.createElement("option");
      randomOpt.value = "__random__"; randomOpt.textContent = "Random per character";
      danceSelect.appendChild(randomOpt);
      for (const [label, kind] of [["", "groove"], ["Power move: ", "move"], ["Pose: ", "pose"]]) {
        for (const c of lib.clips.filter((x) => x.kind === kind)) {
          const opt = document.createElement("option");
          opt.value = c.name; opt.textContent = label + c.name;
          danceSelect.appendChild(opt);
        }
      }
      danceSelect.value = grooves.includes("Hip Hop Dancing") ? "Hip Hop Dancing" : grooves[0];

      resizeRenderer();
      statusEl.textContent = "Ready.";
      generateBtn.disabled = false;
      runGenerate();
      animate();
    } catch (err) {
      showError(`Startup failed: ${err?.message ?? err}`);
      statusEl.textContent = "Failed to load — see error below.";
    }
  }

  function runGenerate() {
    clearError();
    const count = Math.max(1, Math.min(150, Math.floor(Number(countInput.value) || 1)));
    countInput.value = count;
    generateBtn.disabled = true;
    statusEl.textContent = `Generating ${count} characters…`;

    requestAnimationFrame(() => {
      const t0g = performance.now();
      const { generated, errors } = generateCrowd(count);
      const t1 = performance.now();
      statusEl.textContent =
        `${generated}/${count} generated in ${(t1 - t0g).toFixed(0)} ms` +
        (errors.length ? ` — ${errors.length} error(s), see below.` : ".");
      if (errors.length) showError(errors.join("\n"));
      generateBtn.disabled = false;
    });
  }

  generateBtn.addEventListener("click", runGenerate);
  countInput.addEventListener("keydown", (e) => { if (e.key === "Enter") runGenerate(); });
  danceSelect.addEventListener("change", assignDances);   // same crowd, new dance (cross-faded)

  window.dance = { get characters() { return characters; }, get lib() { return lib; }, fitter: () => fitter, camera, controls };
  boot();
</script>

</body>
</html>
